name = "ischool-beta"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Environment variables (set via Cloudflare dashboard or wrangler for secrets)
[vars]
DB_PROVIDER = "lightbase"
LIGHTBASE_PROJECT = "ischool-beta"
LIGHTBASE_BASE_URL = "https://lightbase.pages.dev"
PLATFORM_ADMINS = "admin@ischool.com:admin123"
PUBLIC_BASE_URL = "https://ischool-beta.pages.dev"
NODE_ENV = "production"

# Secrets (set via: wrangler pages secret put <NAME>)
# LIGHTBASE_API_KEY
# SESSION_SECRET
# ENCRYPTION_KEY
# AI_API_KEY
# AI_BASE_URL
# AI_MODEL
