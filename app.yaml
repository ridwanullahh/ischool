# Bismillah — ischool on Google Cloud App Engine (standard, nodejs20).
# One-click deploy: bash scripts/deploy-appengine.sh
runtime: nodejs20
service: default
instance_class: F1
entrypoint: node ./dist/server/entry.mjs
env_variables:
  NODE_ENV: "production"
  HOST: "0.0.0.0"
  PORT: "8080"
automatic_scaling:
  min_instances: 0
  max_instances: 1
  target_cpu_utilization: 0.75
handlers:
  - url: /.*
    script: auto
    secure: always
